[project]
name = "shoe-backend"
version = "2.0.0"
description = "Activity Tracker API - FastAPI + asyncpg backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.31.0",
    "slowapi>=0.1.9",
    "pydantic[email]>=2.9.2",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
]
